# This is to give a default value to the `mode` parameter in the
# `pkgdown::build_site` function. This is useful when building the site locally,
# as it will default to `devel` mode. In practice, this should all be handled
# dynamically by the CI/CD pipeline.
development:
  mode: devel

template:
  package: delphidocs

url: https://cmu-delphi.github.io/epidatr/

redirects:
  - ["articles/v5-api-demo.html", "articles/epidatr.html"]

home:
  links:
    - text: Get the Python client
      href: https://github.com/cmu-delphi/epidatpy/
  sidebar:
    structure: [links, license, community, citation, authors, related, dev]
    components:
      related:
        title: Delphi packages and resources
        text: |
          * [The epiprocess R package](https://cmu-delphi.github.io/epiprocess/)
          * [The epipredict R package](https://cmu-delphi.github.io/epipredict/)
          * [The epidatasets R package](https://cmu-delphi.github.io/epidatasets/)
          * [Introduction to Delphi's Tooling Work](https://cmu-delphi.github.io/delphi-tooling-book/)


reference:
  - title: Query the new Epidata API (v5)
    desc: >
      The current API. See `vignette("migration-guide")` for how to update covidcast queries.
  - contents:
      - epidata_meta
      - cast_api_queries
      - epidata_aux
  - title: Query the covidcast endpoint (v4)
    desc: >
      The previous main endpoint, frozen since September 22, 2026. It still
      serves historical data but receives no new data; use the v5 functions
      above for current data.
  - contents:
      - pub_covidcast
      - pub_covidcast_meta
      - covidcast_epidata
  - title: Query legacy endpoints (v3)
    desc: >
      Older endpoints, each with its own dataset. Most are static or no
      longer updated.
  - contents:
      - has_keyword("endpoint")
      - -starts_with("pvt_")
      - -epidata_meta
      - -cast_api_queries
      - -epidata_aux
      - -pub_covidcast
      - -pub_covidcast_meta
  - title: Make API requests
    desc: Discover endpoints and control how queries are built and fetched
  - contents:
      - avail_endpoints
      - epidata_call
      - fetch_args_list
  - title: Configuration and utilities
    desc: >
      Set the API key (`get_api_key()`, `save_api_key()`), which lifts the
      anonymous rate limits but does not grant access to private endpoints.
      Also the date types that endpoints accept: `epirange()` and `timeset`.
  - contents:
      - get_api_key
      - epirange
      - timeset
  - title: Control caching behavior
    desc: >
      Optionally store API responses on disk so repeated calls do not hit the
      API again. The cache is off by default, and it only stores calls for a
      fixed past version of the data (not "latest"), since those cannot change.
      See `set_cache()` for the environment variables that turn it on.
  - contents:
      - set_cache
      - clear_cache
      - disable_cache
      - cache_info
  - title: Make requests to private API endpoints
    desc: >
      These endpoints serve restricted data sources. Besides an API key, they
      need a separate `auth` token, passed as the `auth` argument. Access is
      granted per data source by Delphi, and the token is not the same as the
      API key. See each endpoint's page for details.
  - contents:
      - starts_with("pvt_")
