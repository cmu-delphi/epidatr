# Bumps the DESCRIPTION version on dev after each merge, unless the merge
# already changed it. Defaults to a patch bump; label the PR `version:minor` or
# `version:major` for a bigger one. The dev ruleset requires PRs, so the bump
# lands through a bot PR that is merged immediately. See DEVELOPMENT.md "Versioning".
on:
  push:
    branches: [dev]

name: version-bump

permissions:
  contents: write
  pull-requests: write

# Queue runs so each bump starts from the previous run's commit.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Check whether the push changed the version
        id: check
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          old=$(git show "$before:DESCRIPTION" | sed -n 's/^Version: //p')
          new=$(git show "${{ github.sha }}:DESCRIPTION" | sed -n 's/^Version: //p')
          echo "Version before push: $old, after push: $new"
          if [ "$old" != "$new" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick bump level from PR labels
        id: level
        if: steps.check.outputs.skip == 'false'
        run: |
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[].labels[].name] | join(",")')
          echo "PR labels: $labels"
          case ",$labels," in
            *,version:major,*) level=major ;;
            *,version:minor,*) level=minor ;;
            *) level=patch ;;
          esac
          echo "level=$level" >> "$GITHUB_OUTPUT"

      - name: Bump through a PR
        if: steps.check.outputs.skip == 'false'
        run: |
          new=$(.github/scripts/bump-version.sh "${{ steps.level.outputs.level }}")
          branch="chore/bump-version-$new"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore: bump version to $new"
          git push origin "$branch"
          gh pr create --base dev --head "$branch" \
            --title "chore: bump version to $new" \
            --body "Automatic ${{ steps.level.outputs.level }} bump after ${{ github.sha }}."
          gh pr merge "$branch" --squash --delete-branch
